name: P0-04 Hosted Verification

on:
  push:
    branches:
      - p0-04-verification

permissions:
  contents: read

concurrency:
  group: p0-04-hosted-verification
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: entiznetstore-preview-verification
    env:
      BASE_URL: https://entiznetstore-env-p0-04-verification-okenechukwus-projects.vercel.app
      SUPABASE_URL: https://peyzicveqigxcrbjzfse.supabase.co
      SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBleXppY3ZlcWlneGNyYmp6ZnNlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc4OTkxNTEsImV4cCI6MjEwMzQ3NTE1MX0.86IjtqYoUegFauy5dOdAFuX_L6-S_bVQfkMR7O6L1zw
      PRODUCTION_SUPABASE_URL: https://kllwwurklumhawfsilpd.supabase.co
      VERCEL_PROJECT_ID: prj_zecR1DW1GImCsW2MmrtTZnxCffbs
      VERCEL_TEAM_ID: team_x6Y9DG451RilMGOAyYDkE1U5
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Generate temporary Vercel automation bypass
        id: bypass
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"
          response="$(curl --fail-with-body --silent --show-error \
            --request PATCH \
            --url "https://api.vercel.com/v1/projects/${VERCEL_PROJECT_ID}/protection-bypass?teamId=${VERCEL_TEAM_ID}" \
            --header "Authorization: Bearer ${VERCEL_TOKEN}" \
            --header 'Content-Type: application/json' \
            --data '{"generate":{"note":"EntizNetStore P0-04 temporary hosted verification"}}')"
          secret="$(printf '%s' "$response" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const x=JSON.parse(s);const p=x.protectionBypass;let secret='';if(typeof p==='string'){secret=p}else if(p&&typeof p==='object'){if(typeof p.secret==='string'){secret=p.secret}else{secret=Object.keys(p).find(k=>/^[A-Za-z0-9]{32}$/.test(k))||''}}process.stdout.write(secret)})")"
          test -n "$secret"
          echo "::add-mask::$secret"
          echo "secret=$secret" >> "$GITHUB_OUTPUT"

      - name: Wait for exact isolated deployment
        shell: bash
        env:
          BYPASS: ${{ steps.bypass.outputs.secret }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p tmp
          for attempt in $(seq 1 60); do
            http_code="$(curl --silent --show-error \
              --output tmp/health-wait.json \
              --write-out '%{http_code}' \
              --header "x-vercel-protection-bypass: ${BYPASS}" \
              --header 'x-vercel-set-bypass-cookie: true' \
              "${BASE_URL}/api/health?x-vercel-protection-bypass=${BYPASS}" || true)"
            summary="$(node -e "const fs=require('fs');try{const x=JSON.parse(fs.readFileSync('tmp/health-wait.json','utf8'));process.stdout.write('status='+(x.status||'unknown')+' version='+(x.version||'unknown')+' checks='+JSON.stringify(x.checks||{}))}catch{process.stdout.write('non-json-response')}" 2>/dev/null || true)"
            echo "Health attempt ${attempt}: HTTP ${http_code} ${summary}"
            if node -e "const fs=require('fs');try{const x=JSON.parse(fs.readFileSync('tmp/health-wait.json','utf8'));process.exit(x.status==='ok'&&x.version===process.env.EXPECTED_COMMIT.slice(0,12)&&x.checks?.database==='ok'&&x.checks?.storage==='ok'&&x.checks?.operations==='ok'?0:1)}catch{process.exit(1)}"; then
              echo "Exact isolated deployment is healthy at ${EXPECTED_COMMIT:0:12}."
              exit 0
            fi
            sleep 5
          done
          echo "Timed out waiting for exact isolated deployment."
          exit 1

      - name: Exercise deployed authenticated authorization
        env:
          DEPLOYED_AUTH_BASE_URL: ${{ env.BASE_URL }}
          DEPLOYED_AUTH_EXPECTED_COMMIT: ${{ github.sha }}
          DEPLOYED_AUTH_TEST_ENVIRONMENT: preview
          DEPLOYED_AUTH_TEST_ALLOW_MUTATION: 'true'
          DEPLOYED_AUTH_SUPABASE_URL: ${{ env.SUPABASE_URL }}
          DEPLOYED_AUTH_SUPABASE_ANON_KEY: ${{ env.SUPABASE_ANON_KEY }}
          DEPLOYED_AUTH_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.DEPLOYED_AUTH_SUPABASE_SERVICE_ROLE_KEY }}
          DEPLOYED_PRODUCTION_SUPABASE_URL: ${{ env.PRODUCTION_SUPABASE_URL }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ steps.bypass.outputs.secret }}
        run: node --import ./scripts/deployed-vercel-bypass.mjs scripts/test-deployed-auth-authorization.mjs

      - name: Upload deployed authorization evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: p0-04-deployed-auth-evidence-${{ github.run_id }}
          path: tmp/deployed-auth-evidence.json
          if-no-files-found: warn
          retention-days: 30

      - name: Revoke temporary Vercel automation bypass
        if: always() && steps.bypass.outputs.secret != ''
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          BYPASS: ${{ steps.bypass.outputs.secret }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --request PATCH \
            --url "https://api.vercel.com/v1/projects/${VERCEL_PROJECT_ID}/protection-bypass?teamId=${VERCEL_TEAM_ID}" \
            --header "Authorization: Bearer ${VERCEL_TOKEN}" \
            --header 'Content-Type: application/json' \
            --data "{\"revoke\":{\"secret\":\"${BYPASS}\",\"regenerate\":false}}" >/dev/null
