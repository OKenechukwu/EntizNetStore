name: Deployed Authorization Gate

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Exact HTTPS preview or staging deployment URL
        required: true
        type: string
      expected_commit:
        description: Exact 40-character Git commit expected from /api/health
        required: true
        type: string
      environment:
        description: Isolated target environment
        required: true
        default: preview
        type: choice
        options:
          - preview
          - staging
      allow_disposable_mutation:
        description: Permit creation and cleanup of disposable test identities
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: deployed-authorization-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deployed-authorization:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: entiznetstore-${{ inputs.environment }}-verification
    env:
      PLAYWRIGHT_NODE_MODULES: /tmp/entiznetstore-playwright/node_modules
    steps:
      - name: Refuse unsafe invocation
        shell: bash
        env:
          BASE_URL: ${{ inputs.base_url }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          ALLOW_MUTATION: ${{ inputs.allow_disposable_mutation }}
          SUPABASE_URL: ${{ secrets.DEPLOYED_AUTH_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.DEPLOYED_AUTH_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.DEPLOYED_AUTH_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          if [ "$ALLOW_MUTATION" != "true" ]; then
            echo "Disposable mutation consent is required."
            exit 1
          fi
          if ! [[ "$EXPECTED_COMMIT" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "expected_commit must be an exact 40-character Git SHA."
            exit 1
          fi
          case "$BASE_URL" in
            https://entiznetstore.vercel.app*|https://www.entiznetstore.*)
              echo "Canonical production targets are intentionally forbidden."
              exit 1
              ;;
            https://*) ;;
            *)
              echo "Target must be HTTPS."
              exit 1
              ;;
          esac
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "The selected GitHub verification environment is missing one or more deployed-auth Supabase secrets."
            exit 1
          fi

      - name: Check out exact repository state
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.expected_commit }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install isolated Chromium browser tooling
        shell: bash
        run: |
          set -euo pipefail
          PLAYWRIGHT_PREFIX=/tmp/entiznetstore-playwright
          rm -rf "$PLAYWRIGHT_PREFIX"
          npm install --prefix "$PLAYWRIGHT_PREFIX" --no-save --package-lock=false playwright@1.62.1
          "$PLAYWRIGHT_PREFIX/node_modules/.bin/playwright" install --with-deps chromium

      - name: Exercise deployed authenticated authorization
        env:
          DEPLOYED_AUTH_BASE_URL: ${{ inputs.base_url }}
          DEPLOYED_AUTH_EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          DEPLOYED_AUTH_TEST_ENVIRONMENT: ${{ inputs.environment }}
          DEPLOYED_AUTH_TEST_ALLOW_MUTATION: ${{ inputs.allow_disposable_mutation }}
          DEPLOYED_AUTH_SUPABASE_URL: ${{ secrets.DEPLOYED_AUTH_SUPABASE_URL }}
          DEPLOYED_AUTH_SUPABASE_ANON_KEY: ${{ secrets.DEPLOYED_AUTH_SUPABASE_ANON_KEY }}
          DEPLOYED_AUTH_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.DEPLOYED_AUTH_SUPABASE_SERVICE_ROLE_KEY }}
          DEPLOYED_PRODUCTION_SUPABASE_URL: ${{ vars.ENTIZNETSTORE_PRODUCTION_SUPABASE_URL }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          PLAYWRIGHT_NODE_MODULES: ${{ env.PLAYWRIGHT_NODE_MODULES }}
        run: node --import ./scripts/deployed-vercel-bypass.mjs scripts/test-deployed-auth-authorization.mjs

      - name: Upload deployed authorization evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: deployed-auth-evidence-${{ github.run_id }}
          path: tmp/deployed-auth-evidence.json
          if-no-files-found: error
          retention-days: 30
