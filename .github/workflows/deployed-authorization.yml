name: P0-04 Credential Sync

on:
  push:
    branches:
      - p0-04-verification

permissions:
  contents: read

concurrency:
  group: p0-04-hosted-verification
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: entiznetstore-preview-verification
    env:
      SUPABASE_URL: https://peyzicveqigxcrbjzfse.supabase.co
      VERCEL_PROJECT_ID: prj_zecR1DW1GImCsW2MmrtTZnxCffbs
      VERCEL_TEAM_ID: team_x6Y9DG451RilMGOAyYDkE1U5
      CUSTOM_ENV_SLUG: p0-04-verification
    steps:
      - name: Validate isolated Supabase service role secret
        shell: bash
        env:
          SERVICE_KEY: ${{ secrets.DEPLOYED_AUTH_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          test -n "$SERVICE_KEY"
          status="$(curl --silent --show-error \
            --output /dev/null \
            --write-out '%{http_code}' \
            --url "${SUPABASE_URL}/rest/v1/profiles_buyer?select=id&limit=1" \
            --header "apikey: ${SERVICE_KEY}" \
            --header "Authorization: Bearer ${SERVICE_KEY}")"
          if [ "$status" != "200" ]; then
            echo "Isolated Supabase service-role validation failed with HTTP ${status}."
            exit 1
          fi
          echo "Isolated Supabase service-role credential validated successfully."

      - name: Resolve Vercel custom environment
        id: custom_env
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error \
            --url "https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}/custom-environments?teamId=${VERCEL_TEAM_ID}" \
            --header "Authorization: Bearer ${VERCEL_TOKEN}")"
          environment_id="$(printf '%s' "$response" | CUSTOM_ENV_SLUG="$CUSTOM_ENV_SLUG" node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const x=JSON.parse(s);const e=x.environments?.find(v=>v.slug===process.env.CUSTOM_ENV_SLUG);if(e?.id)process.stdout.write(e.id)})")"
          test -n "$environment_id"
          echo "Resolved isolated Vercel custom environment."
          echo "environment_id=$environment_id" >> "$GITHUB_OUTPUT"

      - name: Upsert branch service role into isolated Vercel environment
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SERVICE_KEY: ${{ secrets.DEPLOYED_AUTH_SUPABASE_SERVICE_ROLE_KEY }}
          CUSTOM_ENV_ID: ${{ steps.custom_env.outputs.environment_id }}
        run: |
          set -euo pipefail
          body="$(SERVICE_KEY="$SERVICE_KEY" CUSTOM_ENV_ID="$CUSTOM_ENV_ID" node -e "process.stdout.write(JSON.stringify({key:'SUPABASE_SERVICE_ROLE_KEY',value:process.env.SERVICE_KEY,type:'sensitive',customEnvironmentIds:[process.env.CUSTOM_ENV_ID],comment:'EntizNetStore P0-04 isolated Supabase branch service role'}))")"
          response="$(curl --fail-with-body --silent --show-error \
            --request POST \
            --url "https://api.vercel.com/v10/projects/${VERCEL_PROJECT_ID}/env?upsert=true&teamId=${VERCEL_TEAM_ID}" \
            --header "Authorization: Bearer ${VERCEL_TOKEN}" \
            --header 'Content-Type: application/json' \
            --data "$body")"
          failed_count="$(printf '%s' "$response" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const x=JSON.parse(s);process.stdout.write(String(Array.isArray(x.failed)?x.failed.length:0))})")"
          test "$failed_count" = "0"
          echo "Vercel isolated service-role variable synchronized successfully."
