name: Deployed Authorization Gate

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Exact HTTPS preview or staging deployment URL
        required: true
        type: string
      expected_commit:
        description: Exact Git commit expected from /api/health
        required: true
        type: string
      environment:
        description: Isolated target environment
        required: true
        default: preview
        type: choice
        options:
          - preview
          - staging
      allow_disposable_mutation:
        description: Permit creation and cleanup of disposable test identities
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: deployed-authorization-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deployed-authorization:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: entiznetstore-${{ inputs.environment }}-verification
    steps:
      - name: Refuse unsafe invocation
        shell: bash
        env:
          BASE_URL: ${{ inputs.base_url }}
          ALLOW_MUTATION: ${{ inputs.allow_disposable_mutation }}
        run: |
          set -euo pipefail
          if [ "$ALLOW_MUTATION" != "true" ]; then
            echo "Disposable mutation consent is required."
            exit 1
          fi
          case "$BASE_URL" in
            https://entiznetstore.vercel.app*|https://www.entiznetstore.*)
              echo "Canonical production targets are intentionally forbidden."
              exit 1
              ;;
            https://*) ;;
            *)
              echo "Target must be HTTPS."
              exit 1
              ;;
          esac

      - name: Check out exact repository state
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Exercise deployed authenticated authorization
        env:
          DEPLOYED_AUTH_BASE_URL: ${{ inputs.base_url }}
          DEPLOYED_AUTH_EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          DEPLOYED_AUTH_TEST_ENVIRONMENT: ${{ inputs.environment }}
          DEPLOYED_AUTH_TEST_ALLOW_MUTATION: ${{ inputs.allow_disposable_mutation }}
          DEPLOYED_AUTH_SUPABASE_URL: ${{ secrets.DEPLOYED_AUTH_SUPABASE_URL }}
          DEPLOYED_AUTH_SUPABASE_ANON_KEY: ${{ secrets.DEPLOYED_AUTH_SUPABASE_ANON_KEY }}
          DEPLOYED_AUTH_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.DEPLOYED_AUTH_SUPABASE_SERVICE_ROLE_KEY }}
          DEPLOYED_PRODUCTION_SUPABASE_URL: ${{ vars.ENTIZNETSTORE_PRODUCTION_SUPABASE_URL }}
        run: node scripts/test-deployed-auth-authorization.mjs
