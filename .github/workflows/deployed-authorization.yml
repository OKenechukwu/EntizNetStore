name: P0-04 Hosted Verification

on:
  push:
    branches:
      - p0-04-verification

permissions:
  contents: read

concurrency:
  group: p0-04-hosted-verification
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: entiznetstore-preview-verification
    env:
      SUPABASE_URL: https://peyzicveqigxcrbjzfse.supabase.co
      SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBleXppY3ZlcWlneGNyYmp6ZnNlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc4OTkxNTEsImV4cCI6MjEwMzQ3NTE1MX0.86IjtqYoUegFauy5dOdAFuX_L6-S_bVQfkMR7O6L1zw
      PRODUCTION_SUPABASE_URL: https://kllwwurklumhawfsilpd.supabase.co
      VERCEL_PROJECT_ID: prj_zecR1DW1GImCsW2MmrtTZnxCffbs
      VERCEL_TEAM_ID: team_x6Y9DG451RilMGOAyYDkE1U5
      PLAYWRIGHT_NODE_MODULES: /tmp/entiznetstore-playwright/node_modules
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install isolated Chromium browser tooling
        shell: bash
        run: |
          set -euo pipefail
          PLAYWRIGHT_PREFIX=/tmp/entiznetstore-playwright
          rm -rf "$PLAYWRIGHT_PREFIX"
          npm install --prefix "$PLAYWRIGHT_PREFIX" --no-save --package-lock=false playwright@1.62.1
          "$PLAYWRIGHT_PREFIX/node_modules/.bin/playwright" install --with-deps chromium

      - name: Validate isolated Supabase service role secret
        shell: bash
        env:
          SERVICE_KEY: ${{ secrets.DEPLOYED_AUTH_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          test -n "$SERVICE_KEY"
          status="$(curl --silent --show-error \
            --output /dev/null \
            --write-out '%{http_code}' \
            --url "${SUPABASE_URL}/rest/v1/profiles_buyer?select=id&limit=1" \
            --header "apikey: ${SERVICE_KEY}" \
            --header "Authorization: Bearer ${SERVICE_KEY}")"
          test "$status" = "200"
          echo "Isolated Supabase service-role credential validated successfully."

      - name: Generate temporary Vercel automation bypass
        id: bypass
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"
          secret="$(node -e "process.stdout.write(require('crypto').randomBytes(16).toString('hex'))")"
          test "${#secret}" -eq 32
          echo "::add-mask::$secret"
          body="$(SECRET="$secret" node -e "process.stdout.write(JSON.stringify({generate:{secret:process.env.SECRET,note:'EntizNetStore P0-04 temporary hosted verification'}}))")"
          response="$(curl --fail-with-body --silent --show-error \
            --request PATCH \
            --url "https://api.vercel.com/v1/projects/${VERCEL_PROJECT_ID}/protection-bypass?teamId=${VERCEL_TEAM_ID}" \
            --header "Authorization: Bearer ${VERCEL_TOKEN}" \
            --header 'Content-Type: application/json' \
            --data "$body")"
          diagnostic="$(printf '%s' "$response" | SECRET="$secret" node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const x=JSON.parse(s);const m=x.protectionBypass&&x.protectionBypass[process.env.SECRET];process.stdout.write('registered='+(m?'yes':'no')+' scope='+(m?.scope||'unknown'))}catch{process.stdout.write('unparseable-registration-response')}})")"
          echo "Bypass registration: $diagnostic"
          echo "secret=$secret" >> "$GITHUB_OUTPUT"

      - name: Resolve exact immutable Vercel deployment
        id: deployment
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            response="$(curl --fail-with-body --silent --show-error \
              --url "https://api.vercel.com/v7/deployments?projectId=${VERCEL_PROJECT_ID}&sha=${EXPECTED_COMMIT}&state=READY&limit=1&teamId=${VERCEL_TEAM_ID}" \
              --header "Authorization: Bearer ${VERCEL_TOKEN}")"
            deployment_url="$(printf '%s' "$response" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const x=JSON.parse(s);const d=x.deployments?.[0];if(d?.state==='READY'&&d?.url)process.stdout.write('https://'+d.url)}catch{}})")"
            if [ -n "$deployment_url" ]; then
              echo "Exact deployment READY for ${EXPECTED_COMMIT:0:12}."
              echo "base_url=$deployment_url" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 5
          done
          echo "Timed out waiting for exact immutable Vercel deployment."
          exit 1

      - name: Verify isolated deployment health
        shell: bash
        env:
          BYPASS: ${{ steps.bypass.outputs.secret }}
          BASE_URL: ${{ steps.deployment.outputs.base_url }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p tmp
          http_code="$(curl --silent --show-error \
            --output tmp/health.json \
            --write-out '%{http_code}' \
            --header "x-vercel-protection-bypass: ${BYPASS}" \
            "${BASE_URL}/api/health?x-vercel-protection-bypass=${BYPASS}")"
          summary="$(node -e "const fs=require('fs');try{const x=JSON.parse(fs.readFileSync('tmp/health.json','utf8'));process.stdout.write('status='+(x.status||'unknown')+' version='+(x.version||'unknown')+' checks='+JSON.stringify(x.checks||{}))}catch{process.stdout.write('non-json-response')}" 2>/dev/null || true)"
          echo "Exact deployment health: HTTP ${http_code} ${summary}"
          test "$http_code" = "200"
          EXPECTED_COMMIT="$EXPECTED_COMMIT" node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('tmp/health.json','utf8'));if(!(x.status==='ok'&&x.version===process.env.EXPECTED_COMMIT.slice(0,12)&&x.checks?.database==='ok'&&x.checks?.storage==='ok'&&x.checks?.operations==='ok'))process.exit(1)"

      - name: Exercise deployed authenticated authorization
        env:
          DEPLOYED_AUTH_BASE_URL: ${{ steps.deployment.outputs.base_url }}
          DEPLOYED_AUTH_EXPECTED_COMMIT: ${{ github.sha }}
          DEPLOYED_AUTH_TEST_ENVIRONMENT: preview
          DEPLOYED_AUTH_TEST_ALLOW_MUTATION: 'true'
          DEPLOYED_AUTH_SUPABASE_URL: ${{ env.SUPABASE_URL }}
          DEPLOYED_AUTH_SUPABASE_ANON_KEY: ${{ env.SUPABASE_ANON_KEY }}
          DEPLOYED_AUTH_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.DEPLOYED_AUTH_SUPABASE_SERVICE_ROLE_KEY }}
          DEPLOYED_PRODUCTION_SUPABASE_URL: ${{ env.PRODUCTION_SUPABASE_URL }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ steps.bypass.outputs.secret }}
          PLAYWRIGHT_NODE_MODULES: ${{ env.PLAYWRIGHT_NODE_MODULES }}
        run: node --import ./scripts/deployed-vercel-bypass.mjs scripts/test-deployed-auth-authorization.mjs

      - name: Upload deployed authorization evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: p0-04-deployed-auth-evidence-${{ github.run_id }}
          path: tmp/deployed-auth-evidence.json
          if-no-files-found: warn
          retention-days: 30

      - name: Revoke temporary Vercel automation bypass
        if: always() && steps.bypass.outputs.secret != ''
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          BYPASS: ${{ steps.bypass.outputs.secret }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --request PATCH \
            --url "https://api.vercel.com/v1/projects/${VERCEL_PROJECT_ID}/protection-bypass?teamId=${VERCEL_TEAM_ID}" \
            --header "Authorization: Bearer ${VERCEL_TOKEN}" \
            --header 'Content-Type: application/json' \
            --data "{\"revoke\":{\"secret\":\"${BYPASS}\",\"regenerate\":false}}" >/dev/null
