name: Update Security Definer Invariant

on:
  push:
    branches:
      - codex/p0-security-definer-surface

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v7
        with:
          ref: codex/p0-security-definer-surface
          fetch-depth: 0

      - name: Update canonical RPC privilege invariant
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/verify-local-database.sql')
          source = path.read_text()

          owner_old = """  foreach v_fn in array array[\n    'public.attach_checkout_payment_intent(uuid,text)',\n    'public.cancel_checkout_session(uuid)',"""
          owner_new = """  foreach v_fn in array array[\n    'public.cancel_checkout_session(uuid)',"""
          if source.count(owner_old) != 1:
              raise SystemExit('expected legacy wrapper owner-surface entry exactly once')
          source = source.replace(owner_old, owner_new, 1)

          anchor = """  if has_function_privilege('anon','public.create_checkout_session_v2(uuid,uuid,uuid)','EXECUTE')\n     or not has_function_privilege('authenticated','public.create_checkout_session_v2(uuid,uuid,uuid)','EXECUTE') then\n    raise exception 'M3 create_checkout_session_v2 execution boundary is incorrect';\n  end if;\n\n"""
          replacement = anchor + """  if has_function_privilege('anon','public.attach_checkout_payment_intent(uuid,text)','EXECUTE')\n     or has_function_privilege('authenticated','public.attach_checkout_payment_intent(uuid,text)','EXECUTE')\n     or not has_function_privilege('service_role','public.attach_checkout_payment_intent(uuid,text)','EXECUTE') then\n    raise exception 'Legacy payment-intent wrapper must be trusted-worker-only';\n  end if;\n\n"""
          if source.count(anchor) != 1:
              raise SystemExit('expected checkout v2 boundary anchor exactly once')
          source = source.replace(anchor, replacement, 1)
          path.write_text(source)
          PY

      - name: Commit invariant update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/verify-local-database.sql
          git diff --cached --check
          git commit -m "Align canonical RPC invariant with retired legacy wrapper"
          git push origin HEAD:codex/p0-security-definer-surface
