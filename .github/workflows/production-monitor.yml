name: Production Monitor

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: entiznetstore-production-monitor
  cancel-in-progress: false

jobs:
  smoke:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Run canonical production smoke with deployment convergence retry
        id: smoke
        continue-on-error: true
        env:
          ENTIZNETSTORE_BASE_URL: https://entiznetstore.vercel.app
          ENTIZNETSTORE_EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            echo "Production smoke attempt ${attempt}/5 for ${ENTIZNETSTORE_EXPECTED_SHA:0:12}"
            if node scripts/test-production-http-smoke.mjs; then
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then
              sleep 20
            fi
          done
          exit 1

      - name: Create or update production incident
        if: steps.smoke.outcome == 'failure'
        uses: actions/github-script@v9
        with:
          script: |
            const title = '[monitor] EntizNetStore production smoke failure';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const expectedVersion = context.sha.slice(0, 12);
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = issues.find((issue) => issue.title === title && !issue.pull_request);
            const body = [
              'The scheduled EntizNetStore production smoke check failed after the deployment-convergence retry window.',
              '',
              `Expected main version: ${expectedVersion}`,
              `Workflow run: ${runUrl}`,
              `Detected at: ${new Date().toISOString()}`,
              '',
              'Treat deployment-version drift, readiness failure, security-header regression, or authorization exposure as release incidents until disproven.',
              'Follow `docs/operations/INCIDENT_RESPONSE.md` before changing production state.',
              'Do not paste credentials, assertions, signed URLs, KYC data, payment payloads, or other secrets into this issue.',
            ].join('\n');

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }

      - name: Close recovered production incident
        if: steps.smoke.outcome == 'success'
        uses: actions/github-script@v9
        with:
          script: |
            const title = '[monitor] EntizNetStore production smoke failure';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const version = context.sha.slice(0, 12);
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            for (const issue of issues.filter((item) => issue.title === title && !item.pull_request)) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `Production smoke recovered successfully at expected main version ${version}. Verification run: ${runUrl}`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
                state_reason: 'completed',
              });
            }

      - name: Fail workflow when production smoke failed
        if: steps.smoke.outcome == 'failure'
        run: exit 1
