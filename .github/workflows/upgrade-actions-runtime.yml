name: Upgrade Actions Runtime

on:
  push:
    branches:
      - codex/p0-actions-runtime-hardening

permissions:
  contents: write

jobs:
  upgrade:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v7
        with:
          ref: codex/p0-actions-runtime-hardening
          fetch-depth: 0

      - name: Upgrade first-party action runtimes
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's#actions/checkout@v4#actions/checkout@v7#g' .github/workflows/ci.yml .github/workflows/http-authorization.yml .github/workflows/production-monitor.yml
          sed -i 's#actions/setup-node@v4#actions/setup-node@v7#g' .github/workflows/ci.yml .github/workflows/http-authorization.yml .github/workflows/production-monitor.yml
          sed -i 's#actions/github-script@v7#actions/github-script@v9#g' .github/workflows/production-monitor.yml

      - name: Commit migrated workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ci.yml .github/workflows/http-authorization.yml .github/workflows/production-monitor.yml
          if git diff --cached --quiet; then
            echo "Active workflows already use current action runtimes"
            exit 0
          fi
          git commit -m "Upgrade GitHub Actions to Node 24 capable majors"
          git push origin HEAD:codex/p0-actions-runtime-hardening
