name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify production foundation
        run: npm run verify:foundation

      - name: Type-check application
        run: npm run typecheck

      - name: Build production application
        run: npm run build

  database-reproduction:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          # Pin the stable release verified for this production baseline.
          # Avoid `latest`: resolving it consumes GitHub release API quota and
          # can make otherwise valid reproduction runs fail nondeterministically.
          version: 2.111.0

      - name: Start fresh local Supabase stack
        run: supabase start

      - name: Reset from repository migrations and seed
        run: supabase db reset --local

      - name: Verify reproduced database invariants
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f scripts/verify-local-database.sql

      - name: Run P0 commerce and authorization regression suite
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f scripts/test-commerce-security.sql

      - name: Stop local Supabase stack
        if: always()
        run: command -v supabase >/dev/null 2>&1 && supabase stop --no-backup || true

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
