name: CI

on:
  pull_request:
  push:
    branches:
      - main
  deployment_status:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: >-
      github.event_name != 'deployment_status' ||
      (github.event.deployment_status.state == 'success' &&
      startsWith(github.event.deployment.ref, 'codex/'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      SHIPPING_QUOTE_PROVIDER: unconfigured
      TAX_QUOTE_PROVIDER: unconfigured
      PAYMENT_PROVIDER: unconfigured
      NEXT_PUBLIC_PAYMENT_PROVIDER: unconfigured
      PAYOUT_PROVIDER: unconfigured
      UPLOAD_SCANNER_MODE: deterministic
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify production foundation
        run: npm run verify:foundation

      - name: Lint application
        run: npm run lint

      - name: Run storage failure recovery regression
        run: npm run test:storage-recovery

      - name: Run upload scanner fail-closed regression
        run: npm run test:upload-scanner

      - name: Run operational logging redaction regression
        run: npm run test:operational-logging

      - name: Run canonical checkout client contract regression
        run: npm run test:canonical-checkout

      - name: Type-check application
        run: npm run typecheck

      - name: Build production application
        run: npm run build

  database-reproduction:
    if: >-
      github.event_name != 'deployment_status' ||
      (github.event.deployment_status.state == 'success' &&
      startsWith(github.event.deployment.ref, 'codex/'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.111.0

      - name: Start fresh local Supabase stack
        run: supabase start

      - name: Reset from repository migrations and seed
        run: supabase db reset --local

      - name: Verify reproduced database invariants
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f scripts/verify-local-database.sql

      - name: Verify M2 structural database invariants
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f scripts/verify-m2-database-invariants.sql

      - name: Verify M3 structural database invariants
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f scripts/verify-m3-database-invariants.sql

      - name: Verify M4A wholesale structural database invariants
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f scripts/verify-m4a-database-invariants.sql

      - name: Run M1 identity, KYC and storage regression suite
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f scripts/test-m1-identity-kyc-storage.sql

      - name: Run M1 BSM verification regression suite
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f scripts/test-m1-bsm-verification.sql

      - name: Run P0 upload quarantine database boundary regression
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f scripts/test-upload-quarantine-safety.sql

      - name: Run P0 operational event ledger regression suite
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f scripts/test-operational-event-ledger.sql

      - name: Run P0 SECURITY DEFINER surface regression suite
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f scripts/test-security-definer-surface.sql

      - name: Run M2 catalogue and moderation regression suite
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f scripts/test-m2-catalog-moderation.sql

      - name: Run M2 inventory reservation guard regression suite
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f scripts/test-m2-inventory-reservation-guard.sql

      - name: Run M2 active product approval invariant regression suite
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f scripts/test-m2-active-approval-invariant.sql

      - name: Run M2 Seller policy completeness regression suite
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f scripts/test-m2-product-policy-completeness.sql

      - name: Run M3 cart and order core regression suite
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f scripts/test-m3-cart-order-core.sql

      - name: Run M4A BSM wholesale marketplace regression suite
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f scripts/test-m4a-wholesale-marketplace.sql

      - name: Run M4A wholesale fail-closed state regression suite
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f scripts/test-m4a-wholesale-fail-closed.sql

      - name: Run M3 identity and operations regression suite
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f scripts/test-m3-identity-operations.sql

      - name: Run M3 EntizNet linked capability authority regression suite
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f scripts/test-m3-entiznet-linked-authority.sql

      - name: Run EntizNet Admin service boundary regression suite
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f scripts/test-entiznet-admin-service-boundary.sql

      - name: Run M3 catalogue governance regression suite
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f scripts/test-m3-catalog-governance.sql

      - name: Run M3 trust and safety regression suite
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f scripts/test-m3-trust-safety-operations.sql

      - name: Run M3 content and notification regression suite
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f scripts/test-m3-content-notification-operations.sql

      - name: Run M3 refund and dispute regression suite
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f scripts/test-m3-refund-dispute-operations.sql

      - name: Run M3 financial operations regression suite
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f scripts/test-m3-financial-operations.sql

      - name: Run P0 commerce and authorization regression suite
        shell: bash
        run: |
          set -euo pipefail
          DB="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          cleanup() {
            psql "$DB" -v ON_ERROR_STOP=1 -c "revoke execute on function public.create_checkout_session(jsonb,jsonb,uuid) from authenticated" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          psql "$DB" -v ON_ERROR_STOP=1 -f scripts/prepare-legacy-commerce-security-test.sql
          psql "$DB" -v ON_ERROR_STOP=1 -f scripts/test-commerce-security.sql

      - name: Run provider-neutral payment regression suite
        shell: bash
        run: |
          set -euo pipefail
          DB="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          cleanup() {
            psql "$DB" -v ON_ERROR_STOP=1 -c "revoke execute on function public.create_checkout_session(jsonb,jsonb,uuid) from authenticated" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          psql "$DB" -v ON_ERROR_STOP=1 -f scripts/prepare-legacy-commerce-security-test.sql
          psql "$DB" -v ON_ERROR_STOP=1 -f scripts/test-payment-provider-abstraction.sql

      - name: Run terminal payment-state regression suite
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f scripts/test-payment-terminal-state.sql

      - name: Run provider-neutral payout ledger regression suite
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f scripts/test-payout-ledger.sql

      - name: Run concurrent payout escrow-claim regression
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: bash scripts/test-payout-concurrency.sh

      - name: Stop local Supabase stack
        if: always()
        run: command -v supabase >/dev/null 2>&1 && supabase stop --no-backup || true

  dependency-audit:
    if: >-
      github.event_name != 'deployment_status' ||
      (github.event.deployment_status.state == 'success' &&
      startsWith(github.event.deployment.ref, 'codex/'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high