name: P0-04 Credential Probe

on:
  push:
    branches:
      - p0-04-verification

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Report credential presence only
        shell: bash
        env:
          HAS_SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' }}
          HAS_VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN != '' }}
          HAS_VERCEL_BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET != '' }}
          HAS_DEPLOYED_AUTH_URL: ${{ secrets.DEPLOYED_AUTH_SUPABASE_URL != '' }}
          HAS_DEPLOYED_AUTH_ANON: ${{ secrets.DEPLOYED_AUTH_SUPABASE_ANON_KEY != '' }}
          HAS_DEPLOYED_AUTH_SERVICE: ${{ secrets.DEPLOYED_AUTH_SUPABASE_SERVICE_ROLE_KEY != '' }}
        run: |
          set -euo pipefail
          printf 'SUPABASE_ACCESS_TOKEN=%s\n' "$HAS_SUPABASE_ACCESS_TOKEN"
          printf 'VERCEL_TOKEN=%s\n' "$HAS_VERCEL_TOKEN"
          printf 'VERCEL_AUTOMATION_BYPASS_SECRET=%s\n' "$HAS_VERCEL_BYPASS"
          printf 'DEPLOYED_AUTH_SUPABASE_URL=%s\n' "$HAS_DEPLOYED_AUTH_URL"
          printf 'DEPLOYED_AUTH_SUPABASE_ANON_KEY=%s\n' "$HAS_DEPLOYED_AUTH_ANON"
          printf 'DEPLOYED_AUTH_SUPABASE_SERVICE_ROLE_KEY=%s\n' "$HAS_DEPLOYED_AUTH_SERVICE"
