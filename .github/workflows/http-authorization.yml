name: HTTP Authorization Regression

on:
  pull_request:
  push:
    branches:
      - main
  deployment_status:

permissions:
  contents: read

concurrency:
  group: http-authorization-${{ github.ref }}
  cancel-in-progress: true

jobs:
  http-authorization:
    if: >-
      github.event_name != 'deployment_status' ||
      (github.event.deployment_status.state == 'success' &&
      startsWith(github.event.deployment.ref, 'codex/'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      SITE_INDEXING_ENABLED: "false"
      SHIPPING_QUOTE_PROVIDER: unconfigured
      TAX_QUOTE_PROVIDER: unconfigured
      PAYMENT_PROVIDER: unconfigured
      NEXT_PUBLIC_PAYMENT_PROVIDER: unconfigured
      PAYOUT_PROVIDER: unconfigured
      UPLOAD_SCANNER_MODE: deterministic
      ADDRESS_SUGGEST_PROVIDER: deterministic
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1
        with:
          version: 2.111.0

      - name: Install locked dependencies
        run: npm ci

      - name: Install isolated Chromium browser tooling
        shell: bash
        run: |
          set -euo pipefail
          PLAYWRIGHT_PREFIX=/tmp/entiznetstore-playwright
          rm -rf "$PLAYWRIGHT_PREFIX"
          npm install --prefix "$PLAYWRIGHT_PREFIX" --no-save --package-lock=false playwright@1.62.1 axe-core@4.13.0
          "$PLAYWRIGHT_PREFIX/node_modules/.bin/playwright" install --with-deps chromium

      - name: Start fresh local Supabase stack
        run: supabase start

      - name: Reset from repository migrations and seed
        run: supabase db reset --local

      - name: Build, boot and exercise real HTTP and browser boundaries
        shell: bash
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          export SUPABASE_URL="$API_URL"
          export SUPABASE_ANON_KEY="$ANON_KEY"
          export SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          export NEXT_PUBLIC_SUPABASE_URL="$API_URL"
          export NEXT_PUBLIC_SUPABASE_ANON_KEY="$ANON_KEY"

          node scripts/test-storage-boundary.mjs
          npm run test:upload-scanner
          npm run build

          PORT=3000 npm start > /tmp/entiznetstore-http.log 2>&1 &
          APP_PID=$!
          cleanup() {
            kill "$APP_PID" >/dev/null 2>&1 || true
            command -v supabase >/dev/null 2>&1 && supabase stop --no-backup >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          ready=0
          for _ in $(seq 1 60); do
            if curl --silent --fail --output /dev/null http://127.0.0.1:3000/; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "Next.js server did not become ready"
            cat /tmp/entiznetstore-http.log
            exit 1
          fi

          ENTIZNETSTORE_BASE_URL=http://127.0.0.1:3000 node scripts/test-production-http-smoke.mjs || {
            status=$?
            echo "Production smoke regression failed; server log follows"
            cat /tmp/entiznetstore-http.log
            exit "$status"
          }

          APP_ORIGIN=http://127.0.0.1:3000 node scripts/test-http-authorization.mjs || {
            status=$?
            echo "HTTP authorization regression failed; server log follows"
            cat /tmp/entiznetstore-http.log
            exit "$status"
          }

          APP_ORIGIN=http://127.0.0.1:3000 node scripts/test-m4a-http-authorization.mjs || {
            status=$?
            echo "M4A wholesale HTTP authorization regression failed; server log follows"
            cat /tmp/entiznetstore-http.log
            exit "$status"
          }

          APP_ORIGIN=http://127.0.0.1:3000 npm run test:upload-safety-http || {
            status=$?
            echo "Upload safety lifecycle HTTP regression failed; server log follows"
            cat /tmp/entiznetstore-http.log
            exit "$status"
          }

          APP_ORIGIN=http://127.0.0.1:3000 node scripts/test-checkout-http-boundary.mjs || {
            status=$?
            echo "Checkout HTTP boundary regression failed; server log follows"
            cat /tmp/entiznetstore-http.log
            exit "$status"
          }

          PLAYWRIGHT_NODE_MODULES=/tmp/entiznetstore-playwright/node_modules \
            APP_ORIGIN=http://127.0.0.1:3000 \
            node scripts/test-m4a-browser.mjs || {
              status=$?
              echo "M4A authenticated browser regression failed; server log follows"
              cat /tmp/entiznetstore-http.log
              exit "$status"
            }

          PLAYWRIGHT_NODE_MODULES=/tmp/entiznetstore-playwright/node_modules \
            APP_ORIGIN=http://127.0.0.1:3000 \
            node scripts/test-web-responsive-browser.mjs || {
              status=$?
              echo "Responsive browser regression failed; server log follows"
              cat /tmp/entiznetstore-http.log
              exit "$status"
            }

          PLAYWRIGHT_NODE_MODULES=/tmp/entiznetstore-playwright/node_modules \
            APP_ORIGIN=http://127.0.0.1:3000 \
            node scripts/test-globalization-accessibility-browser.mjs || {
              status=$?
              echo "Globalization/accessibility DOM regression failed; server log follows"
              cat /tmp/entiznetstore-http.log
              exit "$status"
            }

          mkdir -p artifacts/web-responsive
          PLAYWRIGHT_NODE_MODULES=/tmp/entiznetstore-playwright/node_modules \
            APP_ORIGIN=http://127.0.0.1:3000 \
            node scripts/test-web-accessibility-browser.mjs \
            2>&1 | tee artifacts/web-responsive/accessibility-regression.log || {
              status=$?
              echo "Accessibility browser regression failed; server log follows" | tee -a artifacts/web-responsive/accessibility-regression.log
              cat /tmp/entiznetstore-http.log | tee -a artifacts/web-responsive/accessibility-regression.log
              exit "$status"
            }

      - name: Upload browser verification artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-browser-verification-${{ github.sha }}
          path: artifacts/web-responsive
          if-no-files-found: ignore
          retention-days: 14

      - name: Stop local Supabase stack
        if: always()
        run: command -v supabase >/dev/null 2>&1 && supabase stop --no-backup || true
