name: Regenerate npm lockfile

on:
  push:
    branches:
      - codex/p0-lint-toolchain-hardening

permissions:
  contents: write

concurrency:
  group: regenerate-lockfile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: codex/p0-lint-toolchain-hardening
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Regenerate npm lockfile from package manifest
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit authoritative lockfile when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Regenerate npm lockfile for ESLint 9"
          git push origin HEAD:codex/p0-lint-toolchain-hardening
