name: Dependency refresh

on:
  push:
    branches:
      - fix/supabase-messaging-consolidation
    paths:
      - .github/workflows/dependency-refresh.yml

permissions:
  contents: read

jobs:
  generate-safe-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply non-breaking audit fixes
        run: npm audit fix --package-lock-only

      - name: Upload refreshed dependency manifests
        uses: actions/upload-artifact@v4
        with:
          name: safe-dependency-refresh
          path: |
            package.json
            package-lock.json
          if-no-files-found: error
