name: Sync Web-First Launch Blockers

on:
  push:
    branches:
      - codex/web-first-launch

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v7
        with:
          ref: codex/web-first-launch
          fetch-depth: 0

      - name: Synchronize canonical launch blockers
        run: python scripts/sync-web-first-launch-blockers.py

      - name: Commit blocker synchronization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LAUNCH_BLOCKERS.md
          git diff --cached --check
          git commit -m "Align launch blockers with web-first release sequence"
          git push origin HEAD:codex/web-first-launch
