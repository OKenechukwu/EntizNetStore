name: Apply dependency refresh

on:
  push:
    branches:
      - fix/supabase-messaging-consolidation
    paths:
      - .github/workflows/apply-dependency-refresh.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/supabase-messaging-consolidation

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply non-breaking audit fixes
        run: npm audit fix --package-lock-only

      - name: Commit refreshed lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet || git commit -m "Apply non-breaking production dependency security updates"
          git push origin HEAD:fix/supabase-messaging-consolidation
